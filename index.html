<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dynamic Theme-Adaptive Favicon System -->
    <link id="app-favicon" rel="icon" type="image/png" href="/logo-light.png" />
    <link rel="apple-touch-icon" href="/logo-dark.png" />
    <script>
      (function() {
        function updateFavicon() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var link = document.getElementById('app-favicon');
          if (link) {
            var targetHref = isDark ? '/logo-light.png' : '/logo-dark.png';
            if (link.getAttribute('href') !== targetHref) {
              link.setAttribute('href', targetHref);
            }
          }
        }
        updateFavicon();
        if (window.matchMedia) {
          var matcher = window.matchMedia('(prefers-color-scheme: dark)');
          if (matcher.addEventListener) {
            matcher.addEventListener('change', updateFavicon);
          } else if (matcher.addListener) {
            matcher.addListener(updateFavicon);
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ARCH — Personal Life OS Dashboard for Tasks, Goals, Journal, Gym, College, Movies & Expenses" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Arch - Personal Life Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
